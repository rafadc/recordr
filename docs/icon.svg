<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5B4BFF"/>
      <stop offset="1" stop-color="#1E1A4D"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7DF2C0"/>
      <stop offset="1" stop-color="#36C2FF"/>
    </linearGradient>
  </defs>
  <!-- macOS icon grid: 824px body, 100px margin, ~185px corner radius -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <!-- loop: an almost-closed ring with an arrowhead -->
  <path d="M 512 262 A 250 250 0 1 1 335 335" fill="none" stroke="url(#ring)" stroke-width="56" stroke-linecap="round"/>
  <path d="M 398 272 L 382 392 L 278 288 Z" fill="#7DF2C0" stroke="#7DF2C0" stroke-width="20" stroke-linejoin="round"/>
  <!-- waveform inside the loop -->
  <g fill="#FFFFFF" transform="translate(512 512)">
    <rect x="-150" y="-40"  width="44" height="80"  rx="22"/>
    <rect x="-82"  y="-100" width="44" height="200" rx="22"/>
    <rect x="-22"  y="-140" width="44" height="280" rx="22"/>
    <rect x="38"   y="-80"  width="44" height="160" rx="22"/>
    <rect x="106"  y="-30"  width="44" height="60"  rx="22"/>
  </g>
</svg>
